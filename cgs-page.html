<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>최규선</title>
  </head>
  <body>
    <h3>안녕하세요 여러분</h3>

    <!-- 1. 클릭할 버튼 추가 -->
    <button id="add-btn">글 추가하기</button>

    <!-- 2. 글이 출력될 div 영역 -->
    <div id="oh">
      <p>금요일이네요 이번주도 고생했습니다.</p>
    </div>

    <script>
      const targetDiv = document.getElementById("oh");
      const addBtn = document.getElementById("add-btn");

      // 버튼 클릭 이벤트 추가
      addBtn.addEventListener("click", function () {
        targetDiv.innerHTML = "<p>🎉 즐거운 주말 보내세요!</p>";
      });
    </script>
  </body>
</html>
