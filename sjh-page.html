<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sjh-page</title>
    <style>
      button {
        display: flex;
        width: 300px;
        height: 200px;
        background-color: blue;
        border: 5px solid red;
        border-radius: 80px;
        margin: auto;
      }
      button:hover {
        background-color: red;
        border: 5px solid blue;
      }
    </style>
  </head>
  <body>
    <div>
      <button onclick="button1()"></button>
      <div id="div1"></div>
    </div>
    <script>
      button1 = () => {
        document.getElementById("div1").textContent = "";
        for (let i = 0; i < 10; i++) {
          const $h1 = document.createElement("h1");
          $h1.textContent = "오늘 수업은 여기까지~";
          document.getElementById("div1").append($h1);
        }
      };
    </script>
  </body>
</html>
